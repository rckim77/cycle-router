<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cycle Router</title>
    <link rel="preconnect" href="https://unpkg.com" />
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIINfQpA7g7CE8fscY3dGgAtdSxnh1R0A="
      crossorigin=""
    />
    <script>
      try {
        const savedTheme = localStorage.getItem("cycle-router.theme");
        const systemTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = ["light", "dark"].includes(savedTheme) ? savedTheme : systemTheme;
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="stylesheet" href="./styles.css?v=18" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-panel" aria-label="Route map">
        <div id="map"></div>
        <div class="map-stats" aria-label="Route distance and time">
          <span class="map-stat">
            <span class="map-label">Ride</span>
            <strong id="distanceReadout">-</strong>
          </span>
          <span class="map-stat-divider" aria-hidden="true">·</span>
          <span class="map-stat">
            <span class="map-label">Time</span>
            <strong id="timeReadout">-</strong>
          </span>
        </div>
      </section>

      <header class="app-header">
        <div class="brand-row">
          <div>
            <h1>Cycle Router 🚲</h1>
          </div>
          <div class="toolbar-actions">
            <button class="icon-button theme-button" id="themeButton" type="button" title="Light mode" aria-label="Light mode"></button>
            <button class="icon-button" id="locateButton" type="button" title="Center on New York City" aria-label="Center on New York City">
              <span aria-hidden="true">&#8982;</span>
            </button>
          </div>
        </div>
      </header>

      <section class="control-panel" aria-label="Route controls">
        <div class="panel-toolbar">
          <div class="panel-tabs" role="tablist" aria-label="Main sections">
            <button class="panel-tab is-active" id="planTabButton" type="button" role="tab" aria-selected="true" aria-controls="planTabPanel" data-tab="plan">
              Plan route
            </button>
            <button class="panel-tab" id="savedTabButton" type="button" role="tab" aria-selected="false" aria-controls="savedTabPanel" data-tab="saved">
              Saved routes
            </button>
          </div>
          <button
            class="panel-collapse-button"
            id="panelCollapseButton"
            type="button"
            aria-expanded="true"
            aria-controls="controlPanelBody"
            title="Hide route panel"
          >
            <svg class="panel-collapse-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="m6 9 6 6 6-6"></path>
            </svg>
            <span class="sr-only">Hide route panel</span>
          </button>
        </div>

        <div id="controlPanelBody" class="control-panel-body">
        <div id="planTabPanel" class="tab-panel" role="tabpanel" aria-labelledby="planTabButton">
          <form id="routeForm" class="route-form">
            <label for="startAddress">
              <span>Start address</span>
              <input
                id="startAddress"
                name="startAddress"
                type="text"
                placeholder="Enter a NYC start address"
                autocomplete="street-address"
              />
            </label>
            <div class="start-address-actions">
              <button class="text-button" id="saveDefaultStartButton" type="button">Save as default start</button>
              <button class="text-button" id="clearDefaultStartButton" type="button" hidden>Clear default</button>
            </div>
            <p class="muted default-start-hint" id="defaultStartHint">
              No default start saved. Enter an address and save one for quicker planning.
            </p>

            <label for="routePrompt">Route description</label>
            <div class="input-stack" id="voiceInputStack">
              <textarea
                id="routePrompt"
                name="routePrompt"
                rows="5"
                placeholder="Example: Loop around Central Park, down the Hudson River Greenway, across Brooklyn Bridge, then back home"
              ></textarea>
              <button class="voice-button" id="voiceButton" type="button" aria-pressed="false" aria-label="Start voice input" title="Start voice input">
                <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
                  <path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v5a3 3 0 0 0 3 3Z"></path>
                  <path d="M19 11a7 7 0 0 1-14 0"></path>
                  <path d="M12 18v4"></path>
                  <path d="M8 22h8"></path>
                </svg>
                <span id="voiceLabel" class="sr-only">Voice</span>
              </button>
              <p id="voiceStatus" class="voice-status" hidden>
                <span class="voice-status-dot" aria-hidden="true"></span>
                <span id="voiceStatusText">Recording audio. Tap the microphone again to stop.</span>
              </p>
            </div>

            <label class="preference-field" for="routeStyle">
              <span>Preference</span>
              <select id="routeStyle" name="routeStyle">
                <option value="balanced">Balanced</option>
                <option value="direct">Direct</option>
                <option value="scenic">Scenic</option>
              </select>
            </label>

            <div class="button-row" id="buttonRow">
              <button class="primary-button" id="mapRouteButton" type="submit">Map route</button>
              <button class="secondary-button" id="saveButton" type="button" hidden>Save</button>
              <button class="secondary-button" id="shareButton" type="button" hidden>Copy Link</button>
            </div>
          </form>

          <div id="routeStatus" class="route-status" role="status" aria-live="polite" hidden>
            <span class="route-status-spinner" aria-hidden="true"></span>
            <span id="routeStatusText">Mapping route…</span>
          </div>

          <article class="route-card" id="routeSummary" aria-live="polite" hidden></article>
        </div>

        <div id="savedTabPanel" class="tab-panel" role="tabpanel" aria-labelledby="savedTabButton" hidden>
          <section class="saved-panel" aria-label="Saved routes">
            <div class="section-heading">
              <h2>Saved routes</h2>
              <button id="clearSavedButton" class="text-button" type="button">Clear</button>
            </div>
            <div id="savedRoutes" class="saved-list"></div>
          </section>
        </div>
        </div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="./app.js?v=18"></script>
  </body>
</html>
